name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package from wheel
        run: |
          pip install dist/*.whl

      - name: Test import
        run: |
          python - <<'PY'
          from genro_toolbox import NamedList, extract_kwargs, safe_is_instance
          from genro_toolbox.dates import parse_period

          row = NamedList({"code": 0, "total": 1}, ["ABC", 10])
          row["total"] = 20
          assert row[1] == 20
          assert dict(row) == {"code": "ABC", "total": 20}
          try:
              NamedList({"x": 1}, (10, 20))
          except ValueError:
              pass
          else:
              raise AssertionError("Inconsistent rows must be rejected")
          print("Import and NamedList validation OK")
          PY

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript tests
        run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Trusted publishing (OIDC): configured on npmjs.com for genro-org/genro-toolbox,
    # publish.yml, environment release. Skips a version already on npm.
    runs-on: ubuntu-latest
    needs: [test, test-js]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@latest

      - name: Publish @genrojs/toolbox
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@genrojs/toolbox@$VERSION" version >/dev/null 2>&1; then
            echo "@genrojs/toolbox@$VERSION is already on npm"
          else
            npm publish --access public
          fi
